# Backlog persistant — La Flotte
# Source de vérité des tâches de l'orchestrateur.
# Convention :
#   - toute demande utilisateur arrive dans `inbox` avant d'être planifiée
#   - `waves[].phases[].tasks[]` porte l'état réel (jamais un état supposé)
#   - `debts[]` liste ce qui est assumé et REPORTÉ, avec la vague cible
#   - `depends_on` (seule clé de dépendance, phases ET tâches) référence des `id`
#   - `status: blocked` ⟺ au moins un `depends_on` de la phase n'est pas `done`
#   - ce fichier est mis à jour dans CHAQUE PR d'intégration (phases B/D)

meta:
  version: 18
  updated_at: "2026-11-22"
  # Phase réellement suivante : pointeur de reprise de l'orchestrateur.
  next: 5B
  # L'orchestrateur ne modifie AUCUN fichier (AGENTS.md règle 1) : il fait écrire
  # ce backlog par l'agent d'intégration, qui signe `updated_by`.
  updated_by: integrator
  statuses: [todo, in_progress, needs_review, approved, blocked, done, dropped]
  status_definitions:
    todo: "planifié, jamais démarré"
    in_progress: "travail local en cours, aucune PR ouverte"
    needs_review: "PR ouverte ET corrections QA en cours"
    approved: "verdict APPROUVÉ rendu, merge pas encore effectué"
    blocked: "ne peut pas démarrer ou finir : dépendance non satisfaite"
    done: "mergé sur main (squash), vérifié"
    dropped: "abandonné, raison en notes"
  update_rules:
    - "seul l'agent d'intégration (integrator) ou un tdd-coder commité écrit ici : l'orchestrateur ne modifie jamais de fichier, il le fait écrire"
    - "mise à jour à chaque verdict QA ET à chaque merge sur main, jamais un état supposé, ni hérité d'un avant-dernier commit"
    - "meta.updated_at est bumpé dans le même commit que le changement d'état"
    - "depends_on est la seule clé de dépendance : status blocked ⟺ au moins un depends_on n'est pas done (invariant bidirectionnel)"
    - "une tâche done, approved ou needs_review cite toujours la PR qui la porte"


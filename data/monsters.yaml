# Monstres de l'île de la Ferraille (Vague 1, bestiaire étendu en 5A).
# resistances.flat / percent : dégâts fixes et pourcentage par élément ; une
# valeur négative est une faiblesse (bornes ±100, cf. `resistanceSchema`).
# `spellIds` ne référence que des sorts réellement déclarés dans spells.yaml :
# les sorts de dégâts du §3 modélisables par le schéma actuel (purs dégâts ou
# dégâts + poussée). Statuts PM/PA, soins, boucliers, zones et invocation
# attendent le moteur d'effets de la 6A. `loot` reste différé en 7B.
# Vague 5B : seules les entrées de butin dont l'item existe déjà dans items.yaml
# sont appliquées (taux et seuils PP du §2 de la fiche, non retouchés) ; le reste
# attend la 7B.
#
# `mp: 4` pour les cinq monstres du donjon de la Casse aux Vis-Sans-Fin (Piou,
# Rat, Crabe, Marmite, Boulon ; le boss était déjà à 4). DEC-10 facture la
# diagonale 2 PM, donc 3 PM ne portaient plus qu'une seule diagonale et un pas
# orthogonal : le tempo de contact perdait un tour dans les salles 1-3. 4 PM le
# leur rendent. Rien d'autre ne bouge (PA, PV, sorts, butins, stats).
monsters:
  - id: piou_mazoute
    name: Piou Mazouté
    description: "Un oiseau de mer couvert de mazout qui demande des comptes à tout le monde, y compris aux vagues."
    level: 1
    hp: 35
    ap: 6
    mp: 4
    # Init 1.29 = champ stocké par grade ; Pious niveau 1 = 0 ; égalité → le héros ouvre.
    initiative: 0
    stats: { strength: 15, intelligence: 0, chance: 0, agility: 0, wisdom: 0 }
    resistances:
      flat: { earth: 0, fire: 0, water: 0, air: 0, neutral: 0 }
      percent: { earth: 0, fire: 0, water: 0, air: 0, neutral: 0 }
    baseXp: 120
    spellIds: [bec_mazoute, fer_spell_coup_daile_gras]
    loot:
      - { itemId: plume_mazoutee, baseDropRate: 0.4, ppThreshold: 100 }
      # §2 de la fiche : seconde source de la goutte. Le Piou est le seul
      # encounter d'exploration, donc la seule des trois ressources butinable hors donjon.
      - { itemId: fer_goutte_mazout, baseDropRate: 0.45, ppThreshold: 100 }

  # La Cour aux Volatiles Gras.
  - id: fer_rat_de_cale
    name: Rat d'Égoût-dron
    description: "Rat de cale nourri au mazout et à la rancune. Il a déjà rongé trois câbles, un contrat de fret et un traité de paix."
    level: 6
    hp: 52
    ap: 5
    mp: 4
    stats: { strength: 22, intelligence: 5, chance: 10, agility: 15, wisdom: 10 }
    resistances:
      flat: { neutral: 1, earth: 1, fire: 0, water: 0, air: 0 }
      percent: { neutral: 5, earth: 5, fire: -5, water: 0, air: -5 }
    baseXp: 55
    spellIds: [fer_spell_morsure_tetanos]
    isBoss: false
    kamasMin: 8
    kamasMax: 18
    ai:
      archetype: melee_rusher
      preferredDistance: 1
      behaviorRules:
        - "Fonce sur la cible la plus faible en PV qu'il peut atteindre ce tour."
        - "Réserve Grignotage de Câble pour un ennemi qui n'a plus que 2 PA."
        - "Ne recule jamais, même à 1 PV."
    loot:
      - { itemId: fer_goutte_mazout, baseDropRate: 0.40, ppThreshold: 100 }
      # DEC-07 : il a déjà rongé trois câbles, un contrat de fret et un traité de
      # paix ; la clef du donjon est la quatrième chose qu'il ne rendra pas.
      # 30/146 × 0,45 = 9,25 % par rencontre.
      - { itemId: cle_donjon_ile_de_la_ferraille, baseDropRate: 0.45, ppThreshold: 100 }

  - id: fer_crabe_cle_molette
    name: Crabe à Clé-à-Molette
    description: "Crabe dont une pince a été remplacée par une clef à molette. Personne ne sait par qui, et personne ne tient à demander."
    level: 9
    hp: 75
    ap: 5
    mp: 4
    stats: { strength: 32, intelligence: 5, chance: 15, agility: 22, wisdom: 10 }
    resistances:
      flat: { neutral: 2, earth: 2, fire: 0, water: 1, air: 0 }
      percent: { neutral: 10, earth: 10, fire: -10, water: 5, air: 0 }
    baseXp: 90
    spellIds: [fer_spell_pince_de_douze]
    isBoss: false
    kamasMin: 12
    kamasMax: 26
    ai:
      archetype: tank_tackler
      preferredDistance: 1
      behaviorRules:
        - "Avance vers la cible la plus proche et se colle à elle pour la tacler."
        - "Garde Serrage de Boulon pour lui-même sous 50 % de PV."
        - "Préfère bloquer un couloir plutôt que frapper fort."
    loot:
      - { itemId: fer_pince_de_douze, baseDropRate: 0.60, ppThreshold: 100 }
      # DEC-07 : la clef du donjon est aussi BUTIN DIRECT, accrochée à la clef à
      # molette qui lui sert de seconde pince. Les taux de la fiche §2 ne bougent
      # pas ; c'est ce chemin-là qui porte la cible 5-10 rencontres :
      # crabe 12/146 × 0,60 = 4,93 % + rat 30/146 × 0,45 = 9,25 %,
      # soit 1 / 14,18 % ≈ 7,05 rencontres, clef craftable en parallèle.
      - { itemId: cle_donjon_ile_de_la_ferraille, baseDropRate: 0.60, ppThreshold: 100 }

  - id: fer_marmite_fuyarde
    name: Marmite qui Fuit
    description: "Marmite de cantine ayant pris la fuite après un procès en empoisonnement. Elle fuit toujours, et elle cuisine toujours."
    level: 12
    hp: 85
    ap: 6
    mp: 4
    stats: { strength: 10, intelligence: 40, chance: 15, agility: 10, wisdom: 15 }
    resistances:
      flat: { neutral: 1, earth: 0, fire: 2, water: 0, air: 0 }
      percent: { neutral: 0, earth: 0, fire: 15, water: -10, air: 0 }
    baseXp: 130
    spellIds: [fer_spell_projection_de_mazout, fer_spell_coup_de_couvercle]
    isBoss: false
    kamasMin: 18
    kamasMax: 35
    ai:
      archetype: support_healer
      preferredDistance: 4
      behaviorRules:
        - "Reste à 3–4 cases derrière la première ligne alliée."
        - "Soigne l'allié le plus blessé en priorité, sans exigence de ligne de vue."
        - "Lance Jet de Vapeur dès que deux ennemis sont adjacents."

  # L'Allée des Boulons Perdus.
  - id: fer_boulon_pousseur
    name: Écrou-Baton
    description: "Un écrou de la taille d'un homme, doué de parole syndicale et d'un sens très développé de l'injustice salariale."
    level: 15
    hp: 105
    ap: 6
    mp: 4
    stats: { strength: 45, intelligence: 10, chance: 10, agility: 18, wisdom: 15 }
    resistances:
      flat: { neutral: 2, earth: 2, fire: 0, water: 0, air: 1 }
      percent: { neutral: 5, earth: 10, fire: 0, water: -5, air: 5 }
    baseXp: 185
    spellIds: [fer_spell_coup_de_tete_filete, fer_spell_lancer_decrou]
    isBoss: false
    kamasMin: 24
    kamasMax: 45
    ai:
      archetype: pusher_control
      preferredDistance: 1
      behaviorRules:
        - "Cherche une cible dos à un mur `#` avant de pousser."
        - "Graisse un allié de première ligne avant de frapper."
        - "Priorise les cibles déjà collées à un obstacle."
    loot:
      - { itemId: fer_boulon_sans_fin, baseDropRate: 0.65, ppThreshold: 100 }

  # L'Atelier d'Yvon Rouiller — boss de la Casse aux Vis-Sans-Fin.
  - id: fer_boss_yvon_rouiller
    name: Yvon Rouiller
    description: "Chef de chantier autoproclamé de La Ferraille. Persuadé qu'un boulon géant retient l'océan, il refuse de le desserrer, même pour dormir."
    level: 20
    hp: 140
    ap: 6
    mp: 4
    stats: { strength: 60, intelligence: 35, chance: 20, agility: 25, wisdom: 25 }
    resistances:
      flat: { neutral: 3, earth: 3, fire: 2, water: 0, air: 1 }
      percent: { neutral: 10, earth: 15, fire: 10, water: -10, air: 5 }
    baseXp: 480
    spellIds: [fer_spell_clef_a_choc]
    isBoss: true
    kamasMin: 85
    kamasMax: 140
    ai:
      archetype: boss_custom
      preferredDistance: 2
      behaviorRules:
        - "Ouvre par Tôle Blindée au tour 1, puis avance vers la cible la plus proche."
        - "Clef à Choc sert à projeter une cible contre un mur `#` tant que le bouclier est actif : bouclier dissipé et −2 PA au prochain tour."
        - "Appel à la Casse dès qu'il tombe sous 50 % de PV ou qu'il reste au plus deux assaillants."
        - "Ne s'éloigne jamais de plus de 2 cases de l'enclume ; sans poussée, son point faible est l'Eau (−10 % de résistance)."
      bossMechanic: "Carapace Oxydée : Tôle Blindée (+20 bouclier, 2 tours). Dégâts de poussée contre un mur `#` pendant que le bouclier est actif ⇒ bouclier dissipé + perte de 2 PA au prochain tour. Sans poussée, −10 % résistance Eau = point faible."

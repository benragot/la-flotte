  # --- Panoplie Goudron-et-Plumes (fiche §6 l.794-798 et l.925-937) ---
  # La panoplie n'existe pas en données : 3 de ses 5 pièces seulement sont des
  # slots acceptés par `SET_SLOTS` (`cloak`, `hat`, `boots`), or `setSchema`
  # exige 3 paliers (2/3/4), donc 4 pièces. Les 5 pièces restent livrées comme
  # équipements autonomes pour ne pas perdre leurs stats (cf. PR, D33).
  # `fer_ceinture_goudron` (slot `belt`, l.795) est livrée, mais sans `setId` :
  # `checkSetSlot` réserve les pièces de panoplie à `hat`/`cloak`/`amulet`/`boots`.
  - id: fer_anneau_mazoute # fiche §6 l.794 / bloc l.809-816
    name: Anneau Mazouté

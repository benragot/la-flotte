# Objets de l'Île de la Ferraille (Vague 4).
# Familles : resource (butin), consumable (soin hors combat), equipment (panoplie + arme),
# key (clef de donjon, liée à `targetDungeonId`).
# stats : objet partiel, entiers, tous les champs sont optionnels.
items:
  - id: plume_mazoutee
    name: Plume mazoutée
    description: "Une plume si lourde qu'elle coule dans la soupe. Le Piou Mazouté la perd en signe de mépris."
    category: resource
    sellPrice: 3

  - id: ferraille_rouillee
    name: Ferraille rouillée
    description: "Une plaque de métal qui rouille plus vite qu'elle ne protège, ce qui est un exploit dans un archipel."
    category: resource
    sellPrice: 2

  - id: ecrou_maudit
    name: Écrou maudit
    description: "Il se dévisse tout seul la nuit, par pure rancune. Les mécaniciens le rangent par superstition."
    category: resource
    sellPrice: 6

  - id: boulon_qui_prie
    name: Boulon qui prie
    description: "Récupéré dans l'épave de la chapelle flottante. Il tient mieux quand on lui parle avec respect."
    category: resource
    sellPrice: 5

  - id: corde_grasse_du_quai
    name: Corde grasse du quai
    description: "Elle sent le poisson, le mazout et les décisions regrettables prises un soir de marée haute."
    category: resource
    sellPrice: 4

  - id: dent_de_piou_mazoute
    name: Dent de Piou Mazouté
    description: "Tombée lors d'un débat sur la propriété des vagues. Le Piou Mazouté avait tort et l'a très mal pris."
    category: resource
    sellPrice: 8

  - id: soupe_de_baleine_tiede
    name: Soupe de baleine tiède
    description: "Chaude à l'aller, tiède au retour, franchement douteuse au fond du bol. Rend un peu de courage et de PV."
    category: consumable
    heal: 20
    price: 15
    sellPrice: 5

  - id: ragout_de_quartier_maitre
    name: Ragoût de quartier-maître
    description: "Deux heures de cuisson, trois jours de regrets. Le remède officiel de la Flotte contre la mauvaise mer."
    category: consumable
    heal: 60
    price: 45
    sellPrice: 15

  - id: chapeau_piou_mazoute
    name: Chapeau du Piou Mazouté
    description: "Un tricorne de récupération qui sent le port, le mazout et le regret d'avoir quitté le nid."
    category: equipment
    slot: hat
    setId: panoplie_piou_mazoute
    level: 1
    stats: { vitality: 5 }
    starting: true
    sellPrice: 12

  - id: cape_graisseuse
    name: Cape graisseuse
    description: "Imperméable à la pluie, aux reproches et aux ordres du capitaine. Elle crisse quand on fuit."
    category: equipment
    slot: cloak
    setId: panoplie_piou_mazoute
    level: 2
    stats: { vitality: 10, wisdom: 2 }
    sellPrice: 20

  - id: amulette_de_la_coupure
    name: Amulette de la Coupure
    description: "Un bout de coque monté sur un lacet. Elle ne protège de rien mais rappelle que la mer a déjà gagné une fois."
    category: equipment
    slot: amulet
    setId: panoplie_piou_mazoute
    level: 2
    stats: { prospection: 5, wisdom: 3 }
    sellPrice: 22

  - id: bottes_de_fond_de_cale
    name: Bottes de fond de cale
    description: "Elles prennent l'eau par le haut, par le bas et par les côtés. Excellentes pour ne pas glisser dans le mazout."
    category: equipment
    slot: boots
    setId: panoplie_piou_mazoute
    level: 2
    stats: { vitality: 8, agility: 2 }
    sellPrice: 18

  - id: gourdin_du_matelot
    name: Gourdin du matelot
    description: "Un bout de mât poli à la main et à l'engueulade. L'arme réglementaire de celui qui n'avait rien d'autre."
    category: equipment
    slot: weapon
    level: 1
    stats: { strength: 3 }
    starting: true
    sellPrice: 8

  # --- Ingrédients de la clef du donjon (fiche de l'île, §4.1) ---
  # `rarity` et `level` du §4 ne sont pas des champs de `itemSchema` : omis
  # plutôt que silencieusement supprimés par Zod. `sellValue` du §4 → `sellPrice`.
  - id: fer_pince_de_douze
    name: Pince de Douze
    description: "Pince sectionnée sur un crabe. Elle serre encore toute seule quand on la pose sur l'établi, par habitude professionnelle."
    category: resource
    sellPrice: 8

  - id: fer_boulon_sans_fin
    name: Boulon Sans Fin
    description: "Boulon fileté sans tête ni écrou. La Confrérie en a fait son emblème, puis son dieu, puis son tarif."
    category: resource
    sellPrice: 12

  - id: fer_goutte_mazout
    name: Goutte de Mazout Durcie
    description: "Une larme de mazout assez vieille pour être devenue solide. On la brûle, on la boit, on la marchande : jamais dans cet ordre."
    category: resource
    sellPrice: 4

  # --- Clé de donjon ---
  - id: cle_donjon_ile_de_la_ferraille
    name: "Clef de la Casse aux Vis-Sans-Fin"
    description: "Une clef à molette géante, tordue à la main. Elle n'ouvre aucune porte de la Casse, mais tout le monde la présente à l'entrée par respect pour la coutume."
    category: key
    targetDungeonId: fer_donjon_casse_vis_sans_fin
    sellPrice: 40

  # --- Armes de la Ferraille (fiche de l'île, §5 l.701-788) ---
  # `weaponType`, `damageLines`, `critRate`, `critBonus`, `apCost`, `minRange`,
  # `maxRange` et `conditions` du §5 n'existent ni dans `itemSchema` ni dans le
  # moteur : omis plutôt que rejetés en silence (voir PR). Aucune ligne de dégâts
  # n'est donc stockée : l'arme ne porte que ses stats.
  # Stats en fourchette `{min,max}` du §5/§6 : figées sur le **jet maximum**
  # (le schéma n'accepte que des entiers plats, cf. §10.5).
  # `sellPrice` est absent du §5/§6 : niveau x 12 (armes) / x 10 (pièces), dans
  # la bande des 5 équipements déjà en données (8 à 22 pour les niveaux 1-2).
  # `percentDamage` -> `percentDmg` (§10.16) ; `crit`, `initiative` et
  # `flatDamage` n'ont aucune clé : omis, jamais renommés au hasard.
  - id: fer_dague_ouvre_boite # fiche §5 l.705 / bloc l.711-728
    name: Dague Ouvre-Boîte
    description: "Une lame taillée dans une boîte de conserve, affûtée sur le pont par pure provocation. Elle ouvre les crabes, les courriers et les conversations."
    category: equipment
    slot: weapon
    level: 9
    stats: { agility: 16 } # agilité 8-16 ; crit 1-2 et initiative 20-50 omis
    sellPrice: 108

  - id: fer_baguette_soudeur # fiche §5 l.706 / bloc l.730-748
    name: Baguette du Soudeur
    description: "Un fer à souder qui a trop servi. Il chauffe la main, la soupe et les malentendus, toujours dans cet ordre et jamais assez fort."
    category: equipment
    slot: weapon
    level: 12
    stats: { intelligence: 18, wisdom: 10 } # int 10-18, sag 5-10 ; dégâts fixes 1-2 omis
    sellPrice: 144

  - id: fer_marteau_cle_de_douze # fiche §5 l.707 / bloc l.750-768
    name: Marteau Clef-de-Douze
    description: "Une clef à molette de douze livres au bout d'un manche. Elle sert à visser, à desserrer et, en dernier recours, à faire valoir son point de vue."
    category: equipment
    slot: weapon
    level: 15
    stats: { strength: 22, vitality: 20 } # force 12-22, vita 10-20
    sellPrice: 180

  - id: fer_pelle_a_gravats # fiche §5 l.708 / bloc l.770-788
    name: Pelle à Gravats
    description: "Une pelle de chantier dont le fer a trempé dans le mazout. Elle ramasse les gravats, les dettes et un peu de la vie des autres."
    category: equipment
    slot: weapon
    level: 17
    stats: { chance: 22, prospection: 12, vitality: 15 } # chance 12-22, PP 6-12, vita 8-15
    sellPrice: 204

  # --- Panoplie Brico-Lourd (fiche §6 l.799-803 et l.938-950) ---
  # Les 4 pièces de slots `amulet`/`cloak`/`hat`/`boots` du dossier : c'est
  # exactement le plafond de 4 pièces du schéma. La 5e,
  # `fer_ceinture_outils_rouilles` (slot `belt`, l.801), est livrée en
  # équipement autonome : `checkSetSlot` interdit un `setId` hors de
  # `SET_SLOTS`, donc elle ne peut pas compter dans la panoplie.
  - id: fer_amulette_ecrou_geante # fiche §6 l.799 / bloc l.853-861
    name: Amulette à l'Écrou Géant
    description: "Un écrou de charrette au bout d'une chaîne de ponton. On jure qu'il a été béni ; personne ne jure avoir assisté au rituel."
    category: equipment
    slot: amulet
    setId: fer_set_brico_lourd
    level: 16
    stats: { strength: 18, vitality: 22 } # force 10-18, vita 12-22 ; dégâts fixes 1-2 omis
    sellPrice: 160

  - id: fer_cape_bache_trouee # fiche §6 l.800 / bloc l.862-870

# Île de la Ferraille — première zone jouable.
# Légende : "." sol praticable, "#" mur (mouvement + ligne de vue),
# "~" eau (mouvement bloqué, ligne de vue libre), "P" joueur, "M" monstre.
maps:
  - id: ferraille_plage_01
    name: Plage de la Ferraille
    width: 12
    height: 12
    grid:
      - "~~~~~~~~...."
      - "~~~~....###."
      - "~~~...##..#."
      - "~~.P.......#"
      - "~~....##...."
      - "~~....##...."
      - "...###......"
      - "......~~~~.."
      - "..#.....#..."
      - "..#..M..#..."
      - "..#.....#..."
      - "............"

    # Décor purement visuel (aucun asset externe) : chaque objet est dessiné
    # procéduralement à partir de ces coordonnées. L'épave est le morceau
    # central ; les `ponton` posent le matériau « planches » sur la grève.
    decor:
      - { type: epave, x: 9, y: 5 }
      - { type: mat, x: 8, y: 6 }
      - { type: cordages, x: 9, y: 6 }
      - { type: cordages, x: 8, y: 4 }
      - { type: baril, x: 10, y: 3 }
      - { type: baril, x: 10, y: 4 }
      - { type: caisse, x: 9, y: 3 }
      - { type: caisse, x: 9, y: 2 }
      - { type: ancre, x: 4, y: 1 }
      - { type: chaine, x: 5, y: 1 }
      - { type: chaine, x: 4, y: 2 }
      - { type: rocher, x: 1, y: 6 }
      - { type: rocher, x: 6, y: 8 }
      - { type: rocher, x: 7, y: 7 }
      - { type: algue, x: 2, y: 1 }
      - { type: algue, x: 5, y: 0 }
      - { type: debris, x: 3, y: 7 }
      - { type: debris, x: 11, y: 11 }
      - { type: ponton, x: 0, y: 8 }
      - { type: ponton, x: 1, y: 8 }
      - { type: ponton, x: 0, y: 9 }
      - { type: ponton, x: 1, y: 9 }


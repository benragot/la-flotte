# Île de la Ferraille — première zone jouable.
# Légende : "." sol praticable, "#" mur (mouvement + ligne de vue),
# "~" eau (mouvement bloqué, ligne de vue libre), "P" joueur, "M" monstre.
maps:
  - id: ferraille_plage_01
    name: Plage de la Ferraille
    width: 12
    height: 12
    grid:
      - "~~~~~~~~...."
      - "~~~~....###."
      - "~~~...##..#."
      - "~~.P.......#"
      - "~~....##...."
      - "~~....##...."
      - "...###......"
      - "......~~~~.."
      - "..#.....#..."
      - "..#..M..#..."
      - "..#.....#..."
      - "............"

    # Décor purement visuel (aucun asset externe) : chaque objet est dessiné
    # procéduralement à partir de ces coordonnées. L'épave est le morceau
    # central ; les `ponton` posent le matériau « planches » sur la grève.
    decor:
      - { type: epave, x: 9, y: 5 }
      - { type: mat, x: 8, y: 6 }
      - { type: cordages, x: 9, y: 6 }
      - { type: cordages, x: 8, y: 4 }
      - { type: baril, x: 10, y: 3 }
      - { type: baril, x: 10, y: 4 }
      - { type: caisse, x: 9, y: 3 }
      - { type: caisse, x: 9, y: 2 }
      - { type: ancre, x: 4, y: 1 }
      - { type: chaine, x: 5, y: 1 }
      - { type: chaine, x: 4, y: 2 }
      - { type: rocher, x: 1, y: 6 }
      - { type: rocher, x: 6, y: 8 }
      - { type: rocher, x: 7, y: 7 }
      - { type: algue, x: 2, y: 1 }
      - { type: algue, x: 5, y: 0 }
      - { type: debris, x: 3, y: 7 }
      - { type: debris, x: 11, y: 11 }
      - { type: ponton, x: 0, y: 8 }
      - { type: ponton, x: 1, y: 8 }
      - { type: ponton, x: 0, y: 9 }
      - { type: ponton, x: 1, y: 9 }

    # Sortie est de la grève : la grille ci-dessus n'a pas bougé, seule cette
    # entrée est ajoutée. Le miroir place le héros à l'ouest de la destination.
    exits:
      - { x: 11, y: 4, to: ferraille_quai_02 }

  # Île de la Ferraille — quai des réclamations. Deuxième carte d'extérieur :
  # aucun `M`, les monstres viendront de `data/spawns.yaml`. Sorties ouest
  # (retour à la plage) et est (vers la cale).
  - id: ferraille_quai_02
    name: Le Quai des Réclamations
    width: 10
    height: 10
    grid:
      - "~~~~~~~~~~"
      - "~.P......~"
      - "~..###...~"
      - "~..#.#...~"
      - "...#.#...."
      - "~..#.#...~"
      - "~..###...~"
      - "~........~"
      - "~.####...~"
      - "~~~~~~~~~~"
    exits:
      - { x: 0, y: 4, to: ferraille_plage_01 }
      - { x: 9, y: 4, to: ferraille_cale_03 }

  # Île de la Ferraille — cale aux serments. Le quai et la cale se répondent :
  # entrer par l'est du quai ressort à l'ouest de la cale, et l'inverse.
  - id: ferraille_cale_03
    name: La Cale aux Serments
    width: 10
    height: 10
    grid:
      - "~~~~~~~~~~"
      - "~...##...~"
      - "~...##...~"
      - "~........~"
      - ".....~...."
      - "~...#....~"
      - "~...#....~"
      - "~.P......~"
      - "~........~"
      - "~~~~~~~~~~"
    exits:
      - { x: 0, y: 4, to: ferraille_quai_02 }

  # Donjon « La Casse aux Vis-Sans-Fin » — salle 1.
  - id: fer_salle_cour_volatiles
    name: La Cour aux Volatiles Gras
    width: 12
    height: 12
    grid:
      - "############"
      - "#P........P#"
      - "#..........#"
      - "#..#....#..#"
      - "#..........#"
      - "#....MM....#"
      - "#....MM....#"
      - "#..........#"
      - "#..#....#..#"
      - "#..........#"
      - "#P........P#"
      - "############"

  # Donjon — salle 2, grille reprise telle quelle de la fiche §8.
  - id: fer_salle_hangar_mazout
    name: Le Hangar à Mazout
    width: 12
    height: 12
    grid:
      - "############"
      - "#..P....M..#"
      - "#.P..##..M.#"
      - "#...~##~...#"
      - "#..~~..~~..#"
      - "#...#..#...#"
      - "#...#..#...#"
      - "#..~~..~~..#"
      - "#...~##~...#"
      - "#.P..##..M.#"
      - "#..P....M..#"
      - "############"

  # Donjon — salle 3.
  - id: fer_salle_allee_boulons
    name: L'Allée des Boulons Perdus
    width: 12
    height: 12
    grid:
      - "############"
      - "#P..#..#..P#"
      - "#...#..#...#"
      - "#...#..#...#"
      - "#..........#"
      - "#.MM....MM.#"
      - "#..........#"
      - "#...#..#...#"
      - "#...#..#...#"
      - "#P..#..#..P#"
      - "#..........#"
      - "############"

  # Donjon — salle 4 (boss), grille reprise telle quelle de la fiche §8.
  - id: fer_salle_atelier_yvon
    name: L'Atelier d'Yvon Rouiller
    width: 12
    height: 12
    grid:
      - "############"
      - "#..#....#..#"
      - "#P...~~...M#"
      - "#.P..~~..M.#"
      - "#..#....#..#"
      - "#....##....#"
      - "#....##....#"
      - "#..#....#..#"
      - "#.P..~~..M.#"
      - "#P...~~...M#"
      - "#..#....#..#"
      - "############"

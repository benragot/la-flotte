      - "~~~~~~~~...."
      - "~~~~....###."
      - "~~~...##..#."
      - "~~.P.......#"
      - "~~....##...."
      - "~~....##...."
      - "...###......"
      - "......~~~~.."
      - "..#.....#..."
      - "..#..M..#..."
      - "..#.....#..."
      - "............"


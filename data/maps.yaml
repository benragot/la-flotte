      - "~~~~....###."
      - "~~~...##..#."
      - "~~.P.......#"
      - "~~....##...."
      - "~~....##...."
      - "...###......"
      - "......~~~~.."
      - "..#.....#..."
      - "..#..M..#..."
      - "..#.....#..."
      - "............"

# Recettes d'artisanat de la Flotte (Vague 5).
# Contrainte : chaque resultItemId et chaque ingrédient existe déjà dans items.yaml.
# craftLevel : 1..50, quantités >= 1, un ingrédient au plus par itemId.
recipes:
  - id: recette_gourdin_du_matelot
    resultItemId: gourdin_du_matelot
    resultQuantity: 1
    ingredients:
      - { itemId: ferraille_rouillee, quantity: 2 }
      - { itemId: corde_grasse_du_quai, quantity: 1 }
    craftLevel: 1
    description: "Un bout de mât, deux plaques de ferraille et beaucoup d'engueulades. L'arme de celui qui n'avait rien d'autre, mais qui l'a maintenant deux fois."

  - id: recette_chapeau_piou_mazoute
    resultItemId: chapeau_piou_mazoute
    resultQuantity: 1
    ingredients:
      - { itemId: plume_mazoutee, quantity: 3 }
      - { itemId: corde_grasse_du_quai, quantity: 1 }
    craftLevel: 2
    description: "Trois plumes cousues serré pour faire un tricorne qui ne vole pas. Le Piou Mazouté trouve ça insultant, ce qui confirme la qualité."

  - id: recette_cape_graisseuse
    resultItemId: cape_graisseuse
    resultQuantity: 1
    ingredients:
      - { itemId: corde_grasse_du_quai, quantity: 2 }
      - { itemId: plume_mazoutee, quantity: 2 }
      - { itemId: ecrou_maudit, quantity: 1 }
    craftLevel: 3
    description: "Deux cordes grasses, quelques plumes et un écrou qui se dévisse la nuit pour tenir le tout. La cape crisse quand on fuit, c'est prévu au cahier des charges."

  - id: recette_amulette_de_la_coupure
    resultItemId: amulette_de_la_coupure
    resultQuantity: 1
    ingredients:
      - { itemId: boulon_qui_prie, quantity: 2 }
      - { itemId: dent_de_piou_mazoute, quantity: 1 }
    craftLevel: 4
    description: "Un bout de coque, deux boulons qui prient et une dent rancunière. Portée au cou, elle ne protège de rien : c'est exactement l'argument de vente."

  - id: recette_bottes_de_fond_de_cale
    resultItemId: bottes_de_fond_de_cale
    resultQuantity: 1
    ingredients:
      - { itemId: ferraille_rouillee, quantity: 2 }
      - { itemId: corde_grasse_du_quai, quantity: 2 }
    craftLevel: 2
    description: "Semelles en ferraille, lacets en corde grasse. Elles prennent l'eau de partout mais elles ne glissent pas dans le mazout, et c'est déjà un métier."

  - id: recette_soupe_de_baleine_tiede
    resultItemId: soupe_de_baleine_tiede
    resultQuantity: 2
    ingredients:
      - { itemId: dent_de_piou_mazoute, quantity: 1 }
      - { itemId: plume_mazoutee, quantity: 1 }
    craftLevel: 1
    description: "On fait bouillir ce qui traîne : une dent pour le goût, une plume pour la texture. Deux bols tièdes, aucun regret avant le troisième."

  - id: recette_ragout_de_quartier_maitre
    resultItemId: ragout_de_quartier_maitre
    resultQuantity: 1
    ingredients:
      - { itemId: soupe_de_baleine_tiede, quantity: 1 }
      - { itemId: dent_de_piou_mazoute, quantity: 2 }
      - { itemId: boulon_qui_prie, quantity: 1 }
    craftLevel: 3
    description: "On reprend la soupe tiède, on l'épaissit de deux dents et on laisse le boulon prier dans la marmite. Trois jours de regrets, comme la tradition l'exige."

  - id: recette_boulon_ressoude
    resultItemId: boulon_qui_prie
    resultQuantity: 1
    ingredients:
      - { itemId: ecrou_maudit, quantity: 2 }
      - { itemId: ferraille_rouillee, quantity: 1 }
    craftLevel: 1
    description: "Un écrou maudit limé jusqu'à ce qu'il arrête de se plaindre, soudé sur une ferraille. Il ne prie plus, mais il tient."

  - id: recette_plume_replumee
    resultItemId: plume_mazoutee
    resultQuantity: 1
    ingredients:
      - { itemId: dent_de_piou_mazoute, quantity: 1 }
      - { itemId: corde_grasse_du_quai, quantity: 1 }
    craftLevel: 1
    description: "On recolle les barbes de la plume avec de la corde grasse et beaucoup de mauvaise foi. Le Piou Mazouté ne reconnaît pas la sienne, ce qui est le but."

  - id: recette_ecrou_demaudit
    resultItemId: ecrou_maudit
    resultQuantity: 1
    ingredients:
      - { itemId: ferraille_rouillee, quantity: 3 }
      - { itemId: boulon_qui_prie, quantity: 1 }
    craftLevel: 2
    description: "Trois ferrailles martyrisées autour d'un boulon qui prie pour qu'on arrête. Le résultat se dévisse tout seul, la malédiction est donc bien conservée."

  # §7 de `docs/design/islands/ile_de_la_ferraille.md`. `craftLevel` n'y est pas
  # fourni : 10 est provisoire et inerte (aucun code ne lit ce champ, seul
  # `recipeSchema` le borne) ; il sera fixé avec la table de spawn d'exploration.
  #
  # ERRATUM §7 (décision `DEC-07`) : la fiche dit pince×3, boulon×3, goutte×2.
  # La recette livrée est 1/1/2 et la fiche porte l'erratum correspondant. Motif :
  # `DEC-07` impose 5 à 10 rencontres par clef, or 3 boulons à 1,78 %/rencontre
  # (poids 4/146 × 0,65) valaient 168 rencontres d'espérance.
  # Les taux de drop du §2 sont INTACTS : le levier retenu est le BUTIN DIRECT,
  # déclaré dans `data/monsters.yaml` (crabe 0,60 + rat 0,45 = 14,18 % par
  # rencontre, soit 1/0,1418 ≈ 7,05 rencontres). Cette recette reste le chemin
  # GARANTI (aucun aléa de butin) et demeure craftable, mais elle n'est plus le
  # chemin le moins cher : son coût est la borne haute
  # Σ 20,28 + 56,15 + 5,12 ≈ 81,55 rencontres, que `DEC-07` ne plafonne pas
  # puisque le joueur prend le butin direct. Garde-fou générique :
  # `tests/data/keyFarmBudget.spec.ts` rejoue ce calcul, tous chemins confondus,
  # sur TOUTES les clefs.
  - id: recette_cle_donjon_ile_de_la_ferraille
    resultItemId: cle_donjon_ile_de_la_ferraille
    resultQuantity: 1
    ingredients:
      - { itemId: fer_pince_de_douze, quantity: 1 }
      - { itemId: fer_boulon_sans_fin, quantity: 1 }
      - { itemId: fer_goutte_mazout, quantity: 2 }
    craftLevel: 10
    description: "Une pince, un boulon et deux gouttes de mazout durci : la clef n'ouvre rien, mais la Confrérie exige qu'on la présente à l'entrée. Le comité a voté, il y a onze ans, et il vote encore."

# Table de spawn d'exploration (5B-g).
# Une zone associe une map de `data/maps.yaml` à un tirage pondéré de monstres :
# le store lit ce fichier, aucun id de monstre n'est écrit en dur dans `src/`.
# `weight` est un poids **relatif** entier, pas un pourcentage : la part d'un
# monstre vaut son poids divisé par la somme de sa zone.
# Zone courante = zone dont `mapId` égale le `mapId` courant du store ; une map
# sans zone tombe en repli sur la première zone (journalisée en exploration).
# Aucune zone ne vise une salle de donjon : le donjon passe par
# `startDungeonRoom`, une salle est derrière la clef.
# DETTE : le modèle n'a aucune notion de niveau de zone. Le filtrage par niveau
# (un héros de niveau 1 ne doit pas croiser un niveau 15) viendra avec les
# prochaines maps d'extérieur ; d'ici là c'est le poids qui limite l'exposition.
# D07 a relevé ce poids pour le Boulon Sans Fin : l'exposition d'un niveau 15
# reste donc une dette OUVERTE, pas une dette refermée.
zones:
  - id: fer_plage_des_ancres
    mapId: ferraille_plage_01
    monsters:
      # ORDRE SIGNIFICATIF : `rng() === 0` (défaut déterministe de la démo et des
      # walkthroughs) prend la **première entrée**, pas la plus lourde. Le Piou
      # doit rester en tête, verrouillé par tests/data/spawns.spec.ts.
      # 100 / 30 / 34 / 32 sur 196 : le Piou reste l'ordinaire de la plage.
      - { monsterId: piou_mazoute, weight: 100 }
      # Le rat est « de cale » : les cales des épaves échouées sur la plage sont
      # son terroir, d'où sa présence en surface portuaire.
      - { monsterId: fer_rat_de_cale, weight: 30 }
      # Le crabe sort à marée basse, entre deux épaves. Poids relevé de 12 à 34
      # par D07 : la Pince de Douze est un ingrédient de la clef du donjon, et la
      # décision propriétaire impose 5 à 10 rencontres par clef. Ses pinces
      # tombent à 0,60 : 34/196 × 0,60 = 10,41 % par rencontre, soit ≈ 9,61
      # rencontres pour la pince de la recette (1 unité).
      - { monsterId: fer_crabe_cle_molette, weight: 34 }
      # Niveau 15 exposé dès le niveau 1 (cf. DETTE ci-dessus) : poids relevé de 4
      # à 32 par D07. Le Boulon Sans Fin n'a aucun autre lâcheur, donc SON POIDS
      # est le seul levier de spawn : 32/196 × 0,65 = 10,61 % par rencontre, soit
      # ≈ 9,42 rencontres pour le boulon de la recette (1 unité). C'est ce poids
      # — et non la fiche §2 — qui portait le farm à 168 rencontres.
      - { monsterId: fer_boulon_pousseur, weight: 32 }

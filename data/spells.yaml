# Sorts jouables et sorts de monstres (Vague 1).
# element : earth | fire | water | air | neutral (optionnel pour kind: other)
# kind    : damage | teleport | other
spells:
  - id: pression
    name: Pression
    description: "Un coup de pression horizontal. Efficace, surtout sur les marins qui n'ont rien demandé."
    classId: iop
    kind: damage
    element: earth
    apCost: 3
    minRange: 1
    maxRange: 2
    requiresLos: true
    damage: { min: 8, max: 12 }

  - id: bond
    name: Bond
    description: "Le héros bondit trois mètres plus loin, atterrit mal, et prétend que c'était calculé."
    classId: iop
    kind: teleport
    element: neutral
    apCost: 5
    minRange: 1
    maxRange: 4
    requiresLos: false

  - id: epee_du_destin
    name: Épée du Destin
    description: "L'épée du destin. Le destin, lui, n'était pas au courant et recule d'une case."
    classId: iop
    kind: damage
    element: fire
    apCost: 4
    minRange: 1
    maxRange: 3
    requiresLos: true
    damage: { min: 10, max: 14 }
    pushCells: 1

  - id: bec_mazoute
    name: Bec Mazouté
    description: "Le piou attaque au bec, avec l'odeur d'un moteur qui a renoncé depuis longtemps."
    classId: monster
    kind: damage
    element: neutral
    apCost: 3
    minRange: 1
    maxRange: 1
    requiresLos: true
    damage: { min: 5, max: 8 }

  # --- Sorts de monstres : Île de la Ferraille (§3 de la fiche) ---
  # Seuls les sorts dont les dégâts, l'élément, la poussée, le coût PA, la portée
  # et les quotas sont représentables par le `spellSchema` actuel sont déclarés.
  # `kind: push_pull` du dossier devient `kind: damage` + `pushCells` (la seule
  # forme que le moteur consomme, cf. `epee_du_destin` et `fleche_de_recul`).
  # Non déclarés (moteur d'effets, 6A) : crachat_mazout (−1 PM), grignotage_cable
  # (−1 PA), serrage_de_boulon et tole_blindee (boucliers), soupe_a_lhuile (soin),
  # jet_de_vapeur (croix 1), pluie_de_rivets (cercle 1), graissage (+1 PM),
  # appel_a_la_casse (invocation).

  - id: fer_spell_coup_daile_gras
    name: Coup d'Aile Gras
    description: "Une aile lourde de mazout qui gifle et fait reculer. L'oiseau appelle ça une manœuvre diplomatique."
    classId: monster
    kind: damage
    element: air
    apCost: 3
    minRange: 1
    maxRange: 1
    requiresLos: true
    cooldown: 1
    castsPerTurn: 1
    castsPerTarget: 1
    damage: { min: 4, max: 6 } # fiche §3 l.264 : 4–6 Air
    pushCells: 1 # fiche §3 l.264 : poussée 1

  - id: fer_spell_morsure_tetanos
    name: Morsure Tétanos
    description: "Deux dents, un câble rouillé et un rappel vaccinal oublié. Le rat facture la morsure au forfait."
    classId: monster
    kind: damage
    element: neutral
    apCost: 3
    minRange: 1
    maxRange: 1
    requiresLos: true
    castsPerTurn: 2
    castsPerTarget: 2
    damage: { min: 7, max: 10 } # fiche §3 l.265 : 7–10 Neutre

  - id: fer_spell_pince_de_douze
    name: Pince de Douze
    description: "La clef à molette remplace la pince et serre d'abord, demande ensuite. Aucun boulon n'a jamais porté plainte."
    classId: monster
    kind: damage
    element: earth
    apCost: 3
    minRange: 1
    maxRange: 1
    requiresLos: true
    castsPerTurn: 2
    castsPerTarget: 2
    damage: { min: 9, max: 13 } # fiche §3 l.267 : 9–13 Terre

  - id: fer_spell_coup_de_couvercle
    name: Coup de Couvercle
    description: "La marmite ouvre son couvercle au mauvais moment. La soupe sort, la politesse aussi."
    classId: monster
    kind: damage
    element: neutral
    apCost: 3
    minRange: 1
    maxRange: 1
    requiresLos: true
    cooldown: 2
    castsPerTurn: 1
    castsPerTarget: 1
    damage: { min: 6, max: 9 } # fiche §3 l.271 : 6–9 Neutre
    pushCells: 2 # fiche §3 l.271 : poussée 2

  - id: fer_spell_projection_de_mazout
    name: Projection de Mazout
    description: "La marmite renverse sa louche dans la figure de quelqu'un. Le mazout est brûlant, la marmite est désolée, et le procès en empoisonnement continue."
    classId: monster
    kind: damage
    element: fire
    apCost: 3
    minRange: 4
    maxRange: 5
    requiresLos: true
    castsPerTurn: 1
    castsPerTarget: 1
    # 5–7 Feu, soit floor(base × 1,40) avec l'Intelligence 40 de la Marmite
    # (cf. `computeDamage`) : 7–9 dégâts nus. Références internes :
    # - `fer_spell_coup_de_couvercle` (même monstre, 3 PA, 1-1) : 6–9 Neutre
    #   sur Force 10, donc un rendement comparable au contact, sans poussée ;
    # - `fer_spell_lancer_decrou` (Boulon niv. 15, 3 PA, 2-4) : 9–12 Neutre
    #   sur Force 45, soit 13–17 : le sort à distance du niveau supérieur frappe
    #   plus fort, notre 7–9 reste celui d'un monstre de niveau 12 ;
    # - `fer_spell_jet_de_vapeur` de la fiche (8–12 Feu, croix 1, non
    #   implémenté) est une zone : la version mono-cible est volontairement
    #   sous ses 11–16 pour ne pas voler le rôle du sort de zone.
    damage: { min: 5, max: 7 }

  - id: fer_spell_coup_de_tete_filete
    name: Coup de Tête Fileté
    description: "Un écrou de la taille d'un homme réclame l'égalité salariale en tête-à-tête, littéralement."
    classId: monster
    kind: damage
    element: earth
    apCost: 3
    minRange: 1
    maxRange: 1
    requiresLos: true
    castsPerTurn: 1
    castsPerTarget: 1
    damage: { min: 10, max: 14 } # fiche §3 l.272 : 10–14 Terre
    pushCells: 2 # fiche §3 l.272 : poussée 2

  - id: fer_spell_lancer_decrou
    name: Lancer d'Écrou
    description: "Un écrou lancé à distance réglementaire, avec le formulaire de réclamation dûment vissé dessus."
    classId: monster
    kind: damage

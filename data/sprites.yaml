# Manifeste des feuilles de sprites animées.
# Format : 256 × 256, grille 4 × 4 de cellules 64 × 64.
#   ligne 0 = idle, ligne 1 = walk, ligne 2 = attack, ligne 3 = hit
# Les SVG sont générés par `node scripts/generate-sprites.mjs` (déterministe).
sprites:
  - entityId: iop
    path: /assets/sprites/iop.svg
    frameWidth: 64
    frameHeight: 64
    animations:
      idle: { row: 0, frames: 4, fps: 6, loop: true }
      walk: { row: 1, frames: 4, fps: 8, loop: true }
      attack: { row: 2, frames: 4, fps: 10, loop: false }
      hit: { row: 3, frames: 4, fps: 10, loop: false }

